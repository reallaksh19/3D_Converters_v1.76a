name: StagedJSON Enriched XML Topology

on:
  pull_request:
    paths:
      - 'tabs/stagedjson-to-enrichxml/**'
      - 'tests/stagedjson-enriched-xml-topology.test.mjs'
      - 'tests/stagedjson-enriched-xml-1885-benchmark.test.mjs'
      - 'tests/stagedjson-psi-sequence-planner.test.mjs'
      - 'tests/stagedjson-psi-writer-selection.test.mjs'
      - '.github/workflows/stagedjson-enriched-xml-topology.yml'
  workflow_dispatch:

jobs:
  topology-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate enriched XML topology contracts
        run: node --test tests/stagedjson-enriched-xml-topology.test.mjs
      - name: Validate real 1885 writer benchmark
        run: node --test tests/stagedjson-enriched-xml-1885-benchmark.test.mjs
      - name: Validate PSI sequence planner
        run: node --test tests/stagedjson-psi-sequence-planner.test.mjs
      - name: Validate guarded writer selection
        run: node --test tests/stagedjson-psi-writer-selection.test.mjs
      - name: Syntax check changed modules
        run: |
          node --check tabs/stagedjson-to-enrichxml/sj-branch-identity.js
          node --check tabs/stagedjson-to-enrichxml/sj-config.js
          node --check tabs/stagedjson-to-enrichxml/sj-enrichment-authority.js
          node --check tabs/stagedjson-to-enrichxml/sj-enrichment-engine.js
          node --check tabs/stagedjson-to-enrichxml/sj-node-contract.js
          node --check tabs/stagedjson-to-enrichxml/sj-parser.js
          node --check tabs/stagedjson-to-enrichxml/sj-psi-sequence-planner.js
          node --check tabs/stagedjson-to-enrichxml/sj-sequential-writer-shadow.js
          node --check tabs/stagedjson-to-enrichxml/sj-xml-writer-parity.js
          node --check tabs/stagedjson-to-enrichxml/sj-xml-writer.js
          node --check tests/stagedjson-enriched-xml-topology.test.mjs
          node --check tests/stagedjson-enriched-xml-1885-benchmark.test.mjs
          node --check tests/stagedjson-psi-sequence-planner.test.mjs
          node --check tests/stagedjson-psi-writer-selection.test.mjs
