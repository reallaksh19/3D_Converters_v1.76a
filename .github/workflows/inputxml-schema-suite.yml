name: InputXML Schema Suite

on:
  pull_request:
    paths:
      - 'contracts/inputxml/v1/**'
      - 'scripts/validate-inputxml-contract-catalogs.py'
      - 'scripts/validate-inputxml-schema-suite.py'
      - '.github/workflows/inputxml-schema-suite.yml'
  workflow_dispatch:

jobs:
  validate-schema-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check lxml==5.4.0
      - name: Validate merged PR-B catalogs
        run: python scripts/validate-inputxml-contract-catalogs.py
      - name: Validate XSD, Schematron, dialect registry, and golden corpus
        run: python scripts/validate-inputxml-schema-suite.py
