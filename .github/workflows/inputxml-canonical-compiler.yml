name: InputXML Canonical Compiler

on:
  pull_request:
    paths:
      - 'contracts/inputxml/v1/**'
      - 'scripts/inputxml_canonical_compiler.py'
      - 'scripts/inputxml_compiler/**'
      - 'scripts/validate-inputxml-contract-catalogs.py'
      - 'scripts/validate-inputxml-schema-suite.py'
      - 'tests/test_inputxml_canonical_compiler*.py'
      - 'tests/test_inputxml_xml_builder_adapter.py'
      - 'tests/test_inputxml_seljson_adapter.py'
      - 'tests/test_inputxml_managed_stage_adapter.py'
      - 'tests/test_inputxml_pdf_input_echo_adapter.py'
      - 'tests/test_inputxml_uxml_rvm_adapter.py'
      - 'tests/xml-cii-node-to-inputxml-core.test.js'
      - 'tests/component-topology-*.test.*'
      - 'tabs/model-converters/xml-cii-node-to-inputxml-*.js'
      - 'tabs/model-converters/converters/component-topology/**'
      - 'tabs/stagedjson-to-enrichxml/**'
      - 'converters/scripts/pdf_to_inputxml*.py'
      - 'converters/scripts/pdf_to_inputxml_profiles.json'
      - 'converters/xml-cii2019-core/custom-input-*.js'
      - 'converters/xml-cii2019-core/restraint-type-*.js'
      - 'tabs/xml-cii-2019-standalone/xml-cii-inputxml-enrichment.js'
      - 'tabs/xml-cii-2019-standalone/xml-cii-workflow-types.js'
      - 'uxml/**'
      - 'rvm-pcf-extract/**'
      - '.github/workflows/inputxml-canonical-compiler.yml'
  workflow_dispatch:

jobs:
  validate-compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install XML and PDF validation runtime
        run: python -m pip install --disable-pip-version-check lxml==5.4.0 pypdf==5.4.0
      - name: Validate merged field and component catalogs
        run: python scripts/validate-inputxml-contract-catalogs.py
      - name: Validate merged XSD, Schematron, registry, and golden corpus
        run: python scripts/validate-inputxml-schema-suite.py
      - name: Validate authoritative Root Branch Node topology engine
        run: |
          node --check scripts/inputxml_compiler/node_xml_builder_bridge.cjs
          node tests/xml-cii-node-to-inputxml-core.test.js
      - name: Validate authoritative managed-stage component topology engine
        run: |
          node --check scripts/inputxml_compiler/node_managed_stage_bridge.mjs
          node tests/component-topology-static.test.js
          node tests/component-topology-support-policy.test.mjs
      - name: Validate PDF and UXML adapter syntax
        run: |
          python -m py_compile converters/scripts/pdf_to_inputxml.py scripts/inputxml_compiler/pdf_input_echo.py scripts/inputxml_compiler/pdf_input_echo_bindings.py scripts/inputxml_compiler/uxml_rvm.py
          node --check scripts/inputxml_compiler/node_uxml_rvm_bridge.mjs
      - name: Run canonical compiler unit and integration tests
        run: |
          set +e
          python -m unittest -v tests/test_inputxml_canonical_compiler.py tests/test_inputxml_canonical_compiler_integration.py tests/test_inputxml_xml_builder_adapter.py tests/test_inputxml_seljson_adapter.py tests/test_inputxml_managed_stage_adapter.py tests/test_inputxml_pdf_input_echo_adapter.py tests/test_inputxml_uxml_rvm_adapter.py 2>&1 | tee /tmp/inputxml-compiler-tests.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Upload compiler test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inputxml-compiler-test-log
          path: /tmp/inputxml-compiler-tests.log
          if-no-files-found: warn
      - name: Run direct canonical CLI smoke
        run: |
          rm -rf /tmp/inputxml-canonical-compiler
          python scripts/inputxml_canonical_compiler.py \
            --input contracts/inputxml/v1/golden/positive/minimal.canonical.input.xml \
            --output-dir /tmp/inputxml-canonical-compiler \
            --dialect canonical-inputxml-v1 \
            --source-repository reallaksh19/3D_Converters \
            --source-path contracts/inputxml/v1/golden/positive/minimal.canonical.input.xml
          test -s /tmp/inputxml-canonical-compiler/minimal.canonical.input.canonical.input.xml
          test -s /tmp/inputxml-canonical-compiler/minimal.canonical.input.canonicalization-ledger.json
          test -s /tmp/inputxml-canonical-compiler/minimal.canonical.input.canonical-validation.json
